name: Sync Dependabot

# Completes a Dependabot pull request that changes bun.lock with what
# Dependabot cannot regenerate: the node_modules hash in nix/probitas.nix.
#
# The commit is pushed with the UPDATE_TOKEN Dependabot secret, a fine-grained
# personal access token with read and write access to Contents on this
# repository. A push made with GITHUB_TOKEN would leave the Test workflow
# waiting for approval. The updated dependencies are only ever installed inside
# the Nix build sandbox, which cannot see the token.

on:
  pull_request:
    paths:
      - bun.lock

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v35

      - name: Update the node_modules hash
        run: |
          if nix build .#probitas --no-link 2> "$RUNNER_TEMP/build.log"; then
            exit 0
          fi
          hash=$(perl -ne 'print $1 if /got:\s+(sha256-\S+)/' "$RUNNER_TEMP/build.log")
          if [ -z "$hash" ]; then
            cat "$RUNNER_TEMP/build.log" >&2
            exit 1
          fi
          perl -pi -e "s#outputHash = \"sha256-[^\"]+\";#outputHash = \"$hash\";#" nix/probitas.nix

      - name: Push the new hash
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if git diff --quiet -- nix/probitas.nix; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(*): update the node_modules hash" -- nix/probitas.nix
          git push "https://x-access-token:${UPDATE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_HEAD_REF}"
