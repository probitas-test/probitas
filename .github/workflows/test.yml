name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A pull request only needs its latest commit checked. A run on main finishes
# instead of being cancelled by the next one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The same gate as local development (justfile).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nicknovitski/nix-develop@v1
      - run: just ci

      # The dev shell's LD_LIBRARY_PATH points at Nix's libstdc++, which
      # programs built for the runner must not load.
      - uses: codecov/codecov-action@v7
        env:
          LD_LIBRARY_PATH: ""
        with:
          files: ./.coverage/lcov.info
          slug: probitas-test/probitas

  # The flake's package, built from source on every platform it supports. Its
  # node_modules hash is shared by all of them; a changed bun.lock makes this
  # fail with the hash to put in nix/probitas.nix.
  nix-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build -L .#probitas

  # Packages the Linux release archive and installs it with install.sh from a
  # local mirror of the GitHub Releases layout, outside the Nix shell, the way
  # users and the Homebrew formula install it.
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v35
      # The steps that act as a user restore this PATH and clear the dev
      # shell's LD_LIBRARY_PATH, so they run outside the Nix shell.
      - run: echo "RUNNER_PATH=$PATH" >> "$GITHUB_ENV"
      - uses: nicknovitski/nix-develop@v1
      - run: just install
      - run: just package --target bun-linux-x64 --out "$RUNNER_TEMP/release"

      - name: Serve the release mirror
        run: |
          bun scripts/serve_release_mirror.ts "$RUNNER_TEMP/release" 2.0.0-ci 18765 &
          timeout 30 sh -c 'until curl -fsS http://127.0.0.1:18765/tag/v2.0.0-ci >/dev/null; do sleep 1; done'

      - run: env PATH="$RUNNER_PATH" sh install.sh
        env:
          LD_LIBRARY_PATH: ""
          PROBITAS_RELEASE_BASE_URL: http://127.0.0.1:18765
          PROBITAS_INSTALL_DIR: ${{ runner.temp }}/root

      - run: env PATH="$RUNNER_PATH" "$RUNNER_TEMP/root/bin/probitas" --version
        env:
          LD_LIBRARY_PATH: ""

      # Scenarios import third-party packages installed next to them, which
      # the executable must resolve from node_modules at runtime.
      - name: Run a scenario that imports from node_modules
        env:
          LD_LIBRARY_PATH: ""
        run: |
          dir="$RUNNER_TEMP/node-modules-scenario"
          mkdir -p "$dir/node_modules/greeting"
          echo '{"name":"greeting","type":"module","exports":"./index.js"}' > "$dir/node_modules/greeting/package.json"
          echo 'export const greeting = "hello";' > "$dir/node_modules/greeting/index.js"
          printf '%s\n' \
            'import { greeting } from "greeting";' \
            'import { expect, scenario } from "@probitas-test/probitas";' \
            'export default scenario("node_modules import")' \
            '  .step("resolves", () => expect(greeting).toBe("hello"))' \
            '  .build();' > "$dir/a.probitas.ts"
          cd "$dir"
          env PATH="$RUNNER_PATH" "$RUNNER_TEMP/root/bin/probitas" run

  # Runs the example scenarios with the compiled binary, from a directory
  # without node_modules, the way users run it.
  scenario-test:
    runs-on: ubuntu-latest
    services:
      echo-http:
        image: ghcr.io/probitas-test/echo-http:latest
        ports:
          - 8080:80
      echo-grpc:
        image: ghcr.io/probitas-test/echo-grpc:latest
        ports:
          - 50051:50051
      echo-connectrpc:
        image: ghcr.io/probitas-test/echo-connectrpc:latest
        ports:
          - 8090:8080
      echo-graphql:
        image: ghcr.io/probitas-test/echo-graphql:latest
        ports:
          - 8100:8080
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
        # The image is Alpine plus the server binary, so wget is the only HTTP
        # client in it. A bare GET answers 400 because SQS wants an Action, so
        # ask for one: ListQueues needs no credentials and answers 200.
        options: >-
          --health-cmd "wget -q -O /dev/null 'http://localhost:9324/?Action=ListQueues' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # MongoDB is started via action instead of services because:
      # - GitHub Actions services don't support custom command options
      # - Transactions require replica set mode (--replSet flag)
      # - supercharge/mongodb-github-action handles replica set initialization
      - uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "7.0"
          mongodb-replica-set: rs0

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v35
      # The steps that act as a user restore this PATH and clear the dev
      # shell's LD_LIBRARY_PATH, so they run outside the Nix shell.
      - run: echo "RUNNER_PATH=$PATH" >> "$GITHUB_ENV"
      - uses: nicknovitski/nix-develop@v1
      - run: just install
      - run: just compile --outfile "$RUNNER_TEMP/probitas"

      - name: Copy scenarios outside the repository
        run: |
          mkdir "$RUNNER_TEMP/scenarios"
          cp -R probitas probitas.jsonc "$RUNNER_TEMP/scenarios/"

      - run: env PATH="$RUNNER_PATH" "$RUNNER_TEMP/probitas" --version
        env:
          LD_LIBRARY_PATH: ""

      - run: env PATH="$RUNNER_PATH" "$RUNNER_TEMP/probitas" run
        working-directory: ${{ runner.temp }}/scenarios
        timeout-minutes: 5
        env:
          LD_LIBRARY_PATH: ""
