name: Update Nix

# Updates the flake inputs and pins flake.nix to Bun's latest release, then
# opens a pull request. Bun is pinned outside nixpkgs, which lags behind its
# releases, so updating flake.lock alone never moves it.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nicknovitski/nix-develop@v1
      - run: nix flake update
      - id: bun
        run: just update-bun
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-nix
          commit-message: "chore(*): update Nix flake inputs and Bun"
          title: "chore(*): update Nix flake inputs and Bun"
          body: |
            Updates `flake.lock` and pins `flake.nix` to Bun's latest release${{ steps.bun.outputs.version && format(' ({0})', steps.bun.outputs.version) || '' }}.

            Generated by the Update Nix workflow.

      # A pull request opened with GITHUB_TOKEN does not run the Test workflow,
      # but GITHUB_TOKEN may dispatch it. A long-lived token that could open
      # the pull request as someone else is not worth keeping for this.
      - if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        run: gh workflow run test.yml --ref update-nix
        env:
          GH_TOKEN: ${{ github.token }}
