name: Update Nix

# Updates the flake inputs and pins flake.nix to Bun's latest release, then
# opens a pull request. Bun is pinned outside nixpkgs, which lags behind its
# releases, so updating flake.lock alone never moves it.
#
# The pull request is opened with the UPDATE_TOKEN secret, a fine-grained
# personal access token with read and write access to Contents and Pull
# requests on this repository. A pull request opened with GITHUB_TOKEN leaves
# the Test workflow waiting for approval; without the secret the job falls back
# to it anyway.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nicknovitski/nix-develop@v1
      - run: nix flake update
      - id: bun
        run: just update-bun
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: update-nix
          commit-message: "chore(*): update Nix flake inputs and Bun"
          title: "chore(*): update Nix flake inputs and Bun"
          body: |
            Updates `flake.lock` and pins `flake.nix` to Bun's latest release${{ steps.bun.outputs.version && format(' ({0})', steps.bun.outputs.version) || '' }}.

            Generated by the Update Nix workflow.
