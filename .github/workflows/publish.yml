name: Publish

# Publishes a release of probitas. The GitHub Release tag is the version
# (v2.0.0 publishes 2.0.0); package.json keeps a placeholder version.
#
# - A published Release builds the binaries and attaches them with
#   SHA256SUMS (install.sh, Homebrew and setup-probitas download them), then
#   publishes the library to npm and JSR. Re-running skips what is already
#   published.
# - A pre-release Release publishes under npm's `next` dist-tag and leaves
#   Homebrew on the latest release.
# - Running the workflow manually is a dry run for the given version.
#
# After a release, the Homebrew formula is updated.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to dry-run the publish with (e.g. 2.0.0)
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the binaries
      id-token: write # npm trusted publishing and JSR OIDC
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node is set up before the dev shell is loaded: the dev shell's
      # LD_LIBRARY_PATH points at Nix's libstdc++, which programs built for
      # the runner must not load, so the npm steps below clear it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (GitHub OIDC) needs npm 11.5.1 or later;
      # @probitas-test/probitas lists this workflow as its trusted publisher.
      - run: npm install -g npm@^11.5.1

      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nicknovitski/nix-develop@v1

      - name: Decide the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "release" ]; then
            version=${TAG#v}
            dist_tag=$([ "$PRERELEASE" = "true" ] && echo next || echo latest)
            dry_run=false
          else
            version=$INPUT_VERSION
            dist_tag=next
            dry_run=true
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tags look like v2.0.0, got ${TAG:-$INPUT_VERSION}"
            exit 1
          fi
          {
            echo "version=$version"
            echo "dist-tag=$dist_tag"
            echo "dry-run=$dry_run"
          } >> "$GITHUB_OUTPUT"

      - run: just install

      # `--version` and the JSR manifest read the version from package.json.
      - name: Set the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun pm pkg set version="$VERSION"
          just jsr-sync

      - run: just build
      - run: just package --out "$RUNNER_TEMP/release"
      - run: bun pm pack --destination "$RUNNER_TEMP/npm"

      - name: Attach the binaries to the release
        if: steps.version.outputs.dry-run != 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/release/* --clobber

      - name: Publish to npm
        env:
          LD_LIBRARY_PATH: ""
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
          DRY_RUN: ${{ steps.version.outputs.dry-run }}
        run: |
          tarball=$(ls "$RUNNER_TEMP"/npm/*.tgz)
          if [ "$DRY_RUN" = "true" ]; then
            npm publish "$tarball" --tag "$DIST_TAG" --access public --dry-run
          elif npm view "@probitas-test/probitas@$VERSION" version > /dev/null 2>&1; then
            echo "@probitas-test/probitas@$VERSION is already on npm"
          else
            npm publish "$tarball" --tag "$DIST_TAG" --access public
          fi

      # `jsr publish` skips a version it already published, so retrying it
      # after a transient registry error is safe.
      - name: Publish to JSR
        env:
          LD_LIBRARY_PATH: ""
          DRY_RUN: ${{ steps.version.outputs.dry-run }}
        run: |
          flags=$([ "$DRY_RUN" = "true" ] && echo --dry-run || true)
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086
            npx --yes jsr publish --allow-dirty $flags && exit 0
            echo "jsr publish failed (attempt $attempt)"
            sleep 30
          done
          exit 1

  update-homebrew:
    needs: publish
    if: github.event_name == 'release' && !github.event.release.prerelease
    uses: ./.github/workflows/update-homebrew.yml
    secrets: inherit
